name: CI

on:
  push:
    branches: [main]
    tags: ["[0-9]*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly, against the latest releases of every dependency
  workflow_dispatch:  # the full set by hand, e.g. before tagging

# The repository default grants write; only the release job needs it.
permissions:
  contents: read

# A new commit on a PR supersedes its running checks; every other run is its
# own group, so none is ever cancelled or skipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: Check the code with ruff
        run: uv run --only-group dev ruff check --output-format=github
      - name: Check the formatting with ruff
        run: uv run --only-group dev ruff format --check

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # the suite takes ~4 min; a hang must not hold a release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # Extends the existing ubuntu/3.14 cell: coverage runs there only.
          - os: ubuntu-latest
            python-version: "3.14"
            coverage: true
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Test with pytest
        if: ${{ !matrix.coverage }}
        run: uv run pytest
      - name: Test with pytest and coverage
        if: ${{ matrix.coverage }}
        run: uv run pytest --cov --cov-report=xml
      - name: Upload coverage reports to Codecov
        if: ${{ matrix.coverage }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    # Not on PRs, to keep them fast: a break shows on main, and never reaches a release.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --group docs  # what Read the Docs installs
      - name: Build the documentation, warnings as errors
        run: uv run make -C docs html SPHINXOPTS="-W --keep-going"

  build:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, test, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
      - name: Build sdist and wheel
        run: uv build
      - name: Check that the built wheel imports as the tagged version
        run: |
          wheel=$(realpath dist/*.whl)
          cd "$RUNNER_TEMP"  # away from the checkout, so the wheel is what gets imported
          version=$(uv run --isolated --no-project --with "$wheel" python -c "import xdas; print(xdas.__version__)")
          test "$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != xdas.__version__ $version"; exit 1; }
      # Here rather than in the release job: a missing section must stop the upload.
      - name: Extract the release notes from the changelog
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            index($0, "## [" tag "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG.md section for $GITHUB_REF_NAME"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/xdas/
    permissions:
      id-token: write  # PyPI trusted publishing, no stored token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: notes
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}  # no checkout to infer it from
        run: |
          # A letter in the tag (0.3.0rc1) marks a pre-release, as PyPI reads it.
          prerelease=$([[ "$GITHUB_REF_NAME" =~ [a-z] ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md $prerelease
